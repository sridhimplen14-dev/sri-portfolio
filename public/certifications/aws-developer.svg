<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="AWS Certified Developer Associate badge">
  <defs>
    <linearGradient id="awsDevBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D3A4B"/>
      <stop offset="100%" stop-color="#161E2D"/>
    </linearGradient>
    <linearGradient id="awsDevRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="55%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#E47911"/>
    </linearGradient>
  </defs>

  <!-- Hexagon badge body -->
  <path
    d="M64 8 L112 36 L112 92 L64 120 L16 92 L16 36 Z"
    fill="url(#awsDevBg)"
    stroke="url(#awsDevRing)"
    stroke-width="3"
  />
  <path
    d="M64 18 L102 40 L102 88 L64 110 L26 88 L26 40 Z"
    fill="none"
    stroke="#FF9900"
    stroke-opacity="0.35"
    stroke-width="1.5"
  />

  <!-- AWS smile mark -->
  <path
    d="M42 78 C52 90, 76 90, 86 78"
    fill="none"
    stroke="#FF9900"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <circle cx="88" cy="76" r="2.2" fill="#FF9900"/>

  <text x="64" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">AWS</text>
  <text x="64" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#FF9900" letter-spacing="0.8">DEVELOPER</text>
  <text x="64" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="600" fill="#C7CDD6" letter-spacing="1.2">ASSOCIATE</text>
</svg>
